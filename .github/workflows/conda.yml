name: Conda

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - conda
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest] # , macos-latest]
        python-version: ["3.8"] # , "3.9"]

    runs-on: ${{ matrix.platform }}

    # The setup-miniconda action needs this to activate miniconda
    defaults:
      run:
        shell: "bash -l {0}"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Get conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: ${{ matrix.python-version }}
          channels: conda-forge
          channel-priority: strict

      - name: Prepare
        run: |
          conda create --yes --name vmec-build-tools python=3.11 conda-build conda-verify

      - name: Build
        run: >-
          conda run --no-capture-output --name vmec-build-tools conda-build
          --python "${{ matrix.python-version }}"
          --output-folder "$RUNNER_TEMP/conda-bld" conda.recipe

      - name: Install
        run: conda install --yes -c "$RUNNER_TEMP/conda-bld" vmec

      # - name: Test
      #  run: ./run_tests
